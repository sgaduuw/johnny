[project]
name = "johnny"
version = "0.5.0"
description = "Ansible callback receiver and fleet-state browser"
authors = [{name = "Eelco Wesemann", email = "6771014+sgaduuw@users.noreply.github.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "Flask (>=3.1.3,<4.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "pydantic[email]>=2.13.4,<3.0.0",
    "sqlalchemy>=2.0.51,<3.0.0",
    "fastapi>=0.137.1,<0.138.0",
    "uvicorn[standard]>=0.49.0,<0.50.0",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "click (>=8.4.1,<9.0.0)",
]

[project.scripts]
johnny = "johnny.cli:cli"

[dependency-groups]
dev = [
    "ruff>=0.15.17,<0.16",
    "pytest>=9.1.0,<10",
    "pytest-cov>=7.1.0,<8",
    "httpx>=0.28.1,<0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["johnny"]
