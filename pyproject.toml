[tool.poetry]
name = "johnny"
version = "0.4.0"
description = "Ansible callback receiver and fleet-state browser"
authors = ["Eelco Wesemann <6771014+sgaduuw@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
Flask = "^3.1.3"
gunicorn = "^26"
pydantic = {extras = ["email"], version = "^2.6.4"}
sqlalchemy = "^2.0"
fastapi = "^0.136.1"
uvicorn = {extras = ["standard"], version = "^0.46.0"}
alembic = "^1.18.4"
pydantic-settings = "^2.14.1"
click = "^8.3.3"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.12"
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
httpx = "^0.28.1"

[tool.poetry.scripts]
johnny = "johnny.cli:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
