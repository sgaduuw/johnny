[project]
name = "johnny"
version = "0.4.0"
description = "Ansible callback receiver and fleet-state browser"
authors = [{name = "Eelco Wesemann", email = "6771014+sgaduuw@users.noreply.github.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "Flask (>=3.1.3,<4.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "pydantic[email] (>=2.6.4,<3.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.46.0,<0.47.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "click (>=8.4.1,<9.0.0)",
]

[project.scripts]
johnny = "johnny.cli:cli"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.14"
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
