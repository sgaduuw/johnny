<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="johnny">
  <title>{% block title %}johnny{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.amber.min.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.6/dist/htmx.min.js"></script>
  <style>
    /* Play / event status colors. Pico amber doesn't expose semantic
       state colors as CSS variables; using CSS named colors keeps
       things light + dark friendly via `light-dark()`. */
    .play-status-finished { color: light-dark(seagreen, lightgreen); }
    .play-status-failed   { color: light-dark(crimson,  lightcoral); }
    .play-status-running  { color: light-dark(darkorange, gold); }
    /* Tighten table density a touch — johnny's tables are wide. */
    table { font-size: 0.95rem; }
    pre   { font-size: 0.85rem; }
    /* Don't wrap individual cell values; the surrounding <figure>
       gives horizontal scroll when the row outgrows the viewport.
       Cells with prose-y content (e.g. comma-joined group lists)
       opt back into wrapping with class="wrap-cell". */
    td, th { white-space: nowrap; }
    td.wrap-cell, th.wrap-cell { white-space: normal; }
    /* Truncate freakishly long values (OpenBSD's
       "GENERIC.MP#82 amd64" kernel string is the canonical offender)
       to a fixed character budget; the full value stays available
       via the cell's title attribute on hover. Width is configurable
       via JOHNNY_TRUNCATE_CHARS; the var() fallback keeps the rule
       sensible if the inline override is missing. */
    td.truncate {
      max-width: var(--truncate-width, 15ch);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Groups overview cards: auto-fill grid that wraps before
       columns get too narrow. Pico's bare `.grid` is equal-column
       no-wrap, which collapses awkwardly when there are many cards. */
    .groups-grid {
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }
    .group-card { margin-bottom: 0; }
    .group-card header { padding-bottom: 0.5rem; }
    /* Sortable header link: subdued by default, primary when active.
       The arrow glyph lives in the link text so it doesn't waste a
       gutter for non-sortable columns. */
    th a.sort-link {
      color: inherit;
      text-decoration: none;
      display: inline-flex;
      gap: 0.25rem;
      align-items: baseline;
    }
    th a.sort-link:hover { text-decoration: underline; }
    th a.sort-link.active { color: var(--pico-primary); }
    th a.sort-link .sort-arrow { font-size: 0.75em; opacity: 0.7; }
    /* Scoped-search input: shrink so it doesn't dominate the layout,
       but stay wide enough for `user:eelco status:failed nginx`. */
    .search-bar { margin-bottom: 1rem; }
    .search-bar input[type="search"] { max-width: 32rem; }
    .htmx-request .search-bar input { opacity: 0.6; }
    /* Sort bar on cards-style lists (no thead to host sort links). */
    .sort-bar { margin-bottom: 0.5rem; }
    .sort-bar a.sort-link { margin: 0 0.15rem; }
    /* Load-more row: a tbody-resident <tr> swapped via outerHTML. */
    td.load-more-cell { text-align: center; padding: 1rem 0; }
    .load-more-btn { margin: 0; max-width: 12rem; }
    /* Unified diff for fact snapshots. Colours via light-dark() so
       both modes stay legible without two rule sets. */
    pre.fact-diff { line-height: 1.35; }
    .fact-diff .diff-add  { color: light-dark(seagreen, lightgreen); }
    .fact-diff .diff-rm   { color: light-dark(crimson, lightcoral); }
    .fact-diff .diff-meta { color: light-dark(dimgray, lightgray); font-weight: 600; }
    .fact-diff .diff-hunk { color: light-dark(steelblue, lightskyblue); }
    .fact-diff .diff-ctx  { opacity: 0.7; }
    /* Compact diff-pair form above the fact-history table. */
    form.diff-pair-form {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
      margin-bottom: 1rem;
    }
    form.diff-pair-form select { width: auto; max-width: 14rem; margin: 0; }
    form.diff-pair-form button { margin: 0; }
  </style>
</head>
<body style="--truncate-width: {{ settings.johnny_truncate_chars }}ch">
  <main class="container">
    <nav>
      <ul>
        <li><a href="{{ url_for('index') }}"><strong>johnny</strong></a></li>
      </ul>
      <ul>
        <li><a href="{{ url_for('index') }}">groups</a></li>
        <li><a href="{{ url_for('playbooks_list') }}">playbooks</a></li>
      </ul>
    </nav>
    {% block content %}{% endblock %}
    <footer>
      <hr>
      <small><em>johnny {{ johnny_version }} — Ansible callback receiver and fleet-state browser.</em></small>
    </footer>
  </main>
</body>
</html>
