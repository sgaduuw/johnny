<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="johnny">
  <title>{% block title %}johnny{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.amber.min.css">
  <style>
    /* Play / event status colors. Pico amber doesn't expose semantic
       state colors as CSS variables; using CSS named colors keeps
       things light + dark friendly via `light-dark()`. */
    .play-status-finished { color: light-dark(seagreen, lightgreen); }
    .play-status-failed   { color: light-dark(crimson,  lightcoral); }
    .play-status-running  { color: light-dark(darkorange, gold); }
    /* Tighten table density a touch — johnny's tables are wide. */
    table { font-size: 0.95rem; }
    pre   { font-size: 0.85rem; }
    /* Don't wrap individual cell values; the surrounding <figure>
       gives horizontal scroll when the row outgrows the viewport.
       Cells with prose-y content (e.g. comma-joined group lists)
       opt back into wrapping with class="wrap-cell". */
    td, th { white-space: nowrap; }
    td.wrap-cell, th.wrap-cell { white-space: normal; }
    /* Truncate freakishly long values (OpenBSD's
       "GENERIC.MP#82 amd64" kernel string is the canonical offender)
       to a fixed character budget; the full value stays available
       via the cell's title attribute on hover. Width is configurable
       via JOHNNY_TRUNCATE_CHARS; the var() fallback keeps the rule
       sensible if the inline override is missing. */
    td.truncate {
      max-width: var(--truncate-width, 15ch);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Groups overview cards: auto-fill grid that wraps before
       columns get too narrow. Pico's bare `.grid` is equal-column
       no-wrap, which collapses awkwardly when there are many cards. */
    .groups-grid {
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }
    .group-card { margin-bottom: 0; }
    .group-card header { padding-bottom: 0.5rem; }
  </style>
</head>
<body style="--truncate-width: {{ settings.johnny_truncate_chars }}ch">
  <main class="container">
    <nav>
      <ul>
        <li><a href="{{ url_for('index') }}"><strong>johnny</strong></a></li>
      </ul>
      <ul>
        <li><a href="{{ url_for('index') }}">groups</a></li>
        <li><a href="{{ url_for('playbooks_list') }}">playbooks</a></li>
      </ul>
    </nav>
    {% block content %}{% endblock %}
    <footer>
      <hr>
      <small><em>johnny — Ansible callback receiver and fleet-state browser.</em></small>
    </footer>
  </main>
</body>
</html>
