# Three containers, one image, three commands. Same operational shape
# as mimir's web/scheduler split, with an extra split between read (web)
# and write (api) tiers — see CONTEXT.md "Container split".
#
# johnny-tasks owns alembic + retention pruning. johnny-web and
# johnny-api both depend on its healthcheck (the migration sentinel
# file), so they only start once the schema is current.
#
# Image: pulls from ghcr.io/sgaduuw/johnny by default. Pin a version
# via JOHNNY_VERSION (e.g. JOHNNY_VERSION=0.1.0 docker compose up).
# `build:` is on johnny-tasks only so `docker compose build` still
# produces a local image with the same name; the other services
# share it via image: alone.

services:
  johnny-tasks:
    build:
      context: .
      target: prod
    image: ghcr.io/sgaduuw/johnny:${JOHNNY_VERSION:-0.1.0}
    command: tasks
    restart: unless-stopped
    volumes:
      - johnny-data:/data
    environment:
      DATABASE_URL: sqlite:////data/johnny.db
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      PRUNE_INTERVAL_SECONDS: ${PRUNE_INTERVAL_SECONDS:-86400}
    healthcheck:
      test: ["CMD", "test", "-f", "/data/.migrated"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  johnny-api:
    image: ghcr.io/sgaduuw/johnny:${JOHNNY_VERSION:-0.1.0}
    command: api
    restart: unless-stopped
    volumes:
      - johnny-data:/data
    environment:
      DATABASE_URL: sqlite:////data/johnny.db
      JOHNNY_API_TOKEN: ${JOHNNY_API_TOKEN:?JOHNNY_API_TOKEN must be set}
      # Defaults to 1 (SQLite single-writer); bump on Postgres.
      API_WORKERS: ${API_WORKERS:-}
    ports:
      - "${API_PORT:-8001}:8001"
    depends_on:
      johnny-tasks:
        condition: service_healthy

  johnny-web:
    image: ghcr.io/sgaduuw/johnny:${JOHNNY_VERSION:-0.1.0}
    command: web
    restart: unless-stopped
    volumes:
      - johnny-data:/data
    environment:
      DATABASE_URL: sqlite:////data/johnny.db
      # Defaults to $(nproc) inside the container.
      WEB_WORKERS: ${WEB_WORKERS:-}
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      johnny-tasks:
        condition: service_healthy

volumes:
  johnny-data:
