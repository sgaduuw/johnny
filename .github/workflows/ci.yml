name: CI

on:
  push:
    branches: [develop, main, "release/*", "hotfix/*"]
    tags: ["v*"]
  pull_request:
    branches: [develop, main, "release/*", "hotfix/*"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install poetry
        run: pip install "poetry==1.8.5"

      - name: Cache poetry virtualenv
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-py3.14-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.14-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check johnny/ tests/

      - name: Test with coverage
        run: poetry run pytest --cov=johnny --cov-report=term --cov-fail-under=97

      - name: Migrations apply cleanly + match models
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          poetry run alembic upgrade head
          poetry run alembic check

      # `alembic check` only verifies model/migration consistency on
      # a fresh schema. The step below also applies the head
      # migration against a *populated* DB at the previous revision,
      # which is the case three v0.2.x migrations broke on (see #6).
      - name: Migration smoke against a populated DB
        env:
          DATABASE_URL: sqlite:///./mig-smoke.db
        run: |
          PREV=$(poetry run alembic history --indicate-current \
                 | awk '/->/ {print $1; exit}')
          if [ -z "$PREV" ] || [ "$PREV" = "<base>" ]; then
            echo "Only one revision in history; skipping smoke."
            exit 0
          fi
          poetry run alembic upgrade "$PREV"
          poetry run python -m tests._mig_seed "$DATABASE_URL"
          poetry run alembic upgrade head
          poetry run python -m tests._mig_smoke_assert "$DATABASE_URL"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # Always build the test stage (loaded into the local docker
      # daemon) so we can run pytest inside the image.
      - name: Build test stage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: johnny:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests inside the image
        run: docker run --rm johnny:test

      # Auth to GHCR; only on push events (PR builds never push).
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags:
      #   main push    -> :latest, :sha-XXXXXXX
      #   v0.1.0 push  -> :v0.1.0, :0.1.0, :0.1, :sha-XXXXXXX
      #   PR           -> :pr-N, :sha-XXXXXXX  (built but not pushed)
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sgaduuw/johnny
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Build + push prod stage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
