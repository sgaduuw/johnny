name: CI

on:
  # CI is the pull-request gate: the test job (lint + pytest-cov +
  # migrations) plus a docker build-verify (build the test stage, run
  # pytest in the image, build the prod stage, no push) on every PR.
  # It runs on NO branch or tag push. The release image is built +
  # published by release.yml on v* tags, which trusts this PR gate
  # rather than re-running anything. (develop is a loose integration
  # branch; main is the PR-gated release branch.)
  pull_request:
    branches: [develop, main, "release/*", "hotfix/*"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check johnny/ tests/

      - name: Test with coverage
        run: uv run pytest --cov=johnny --cov-report=term --cov-fail-under=97

      - name: Migrations apply cleanly + match models
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

      # `alembic check` only verifies model/migration consistency on
      # a fresh schema. The step below also applies the head
      # migration against a *populated* DB at the previous revision,
      # which is the case three v0.2.x migrations broke on (see #6).
      - name: Migration smoke against a populated DB
        env:
          DATABASE_URL: sqlite:///./mig-smoke.db
        run: |
          PREV=$(uv run alembic history --indicate-current \
                 | awk '/->/ {print $1; exit}')
          if [ -z "$PREV" ] || [ "$PREV" = "<base>" ]; then
            echo "Only one revision in history; skipping smoke."
            exit 0
          fi
          uv run alembic upgrade "$PREV"
          uv run python -m tests._mig_seed "$DATABASE_URL"
          uv run alembic upgrade head
          uv run python -m tests._mig_smoke_assert "$DATABASE_URL"

  docker:
    # Build-verify only: builds the test stage, runs pytest inside the
    # image, and builds the prod stage (no push). Never logs in or
    # publishes; release.yml publishes the prod image on v* tags.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build the test stage (loaded into the local docker daemon) so
      # we can run pytest inside the image.
      - name: Build test stage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: johnny:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests inside the image
        run: docker run --rm johnny:test

      # Build the prod stage to verify it builds; no push. Publishing
      # is release.yml's job on v* tags.
      - name: Build prod stage (verify only, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
