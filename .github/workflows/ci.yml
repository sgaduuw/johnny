name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poetry
        run: pip install "poetry==1.8.5"

      - name: Cache poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check johnny/ tests/

      - name: Test with coverage
        run: poetry run pytest --cov=johnny --cov-report=term --cov-fail-under=85

      - name: Migrations apply cleanly + match models
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          poetry run alembic upgrade head
          poetry run alembic check
